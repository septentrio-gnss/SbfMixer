<!-- Player Node HTML -->
<script type="text/javascript">
    RED.nodes.registerType('player',{
        category: 'Septentrio',
        color: '#fb9313',
        defaults: {
            name: {value:""},
            changeTimeToActual: {value: true, required: true},
            maxWaitThreshold: {value: 5000, required: true, validate: RED.validators.number()},
            fallbackWaitTime: {value: 500, required: true, validate: RED.validators.number()}
        },
        inputs:1,
        outputs:1,
        icon: "inject.svg",
        label: function() {
            return this.name || "Player";
        },
        inputLabels: "Control (Activate/Pause)",
        outputLabels: "GNSS Stream"
    });
</script>

<script type="text/html" data-template-name="player">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Player">
    </div>
    <div class="form-row">
        <label for="node-input-changeTimeToActual" style="width: 70%"><i class="fa fa-clock-o"></i> Adjust Time to Actual</label>
        <input type="checkbox" id="node-input-changeTimeToActual" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-changeTimeToActual" style="width: auto"> Shift message timestamps during playback?</label>
    </div>
    <div class="form-row">
        <label for="node-input-maxWaitThreshold"><i class="fa fa-hourglass-half"></i> Max Wait Threshold (ms)</label>
        <input type="number" id="node-input-maxWaitThreshold" placeholder="5000" style="width: 100px;">
        <span style="margin-left: 10px;">Maximum delay before fast-forwarding.</span>
    </div>
    <div class="form-row">
        <label for="node-input-fallbackWaitTime"><i class="fa fa-step-forward"></i> Fallback Wait (ms)</label>
        <input type="number" id="node-input-fallbackWaitTime" placeholder="500" style="width: 100px;">
        <span style="margin-left: 10px;">Wait time used when fast-forwarding.</span>
    </div>
</script>

<script type="text/html" data-help-name="player">
    <p>Buffers incoming SBF messages and plays them back sequentially based on their GPS time (TOW/WNc).</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>msg with SBF block <span class="property-type">object</span></dt>
        <dd>An SBF message with <code>msg.type === 'SBF'</code> and <code>msg.block</code> containing:
            <ul>
                <li><code>msg.block.TOW</code> (number): GPS Time of Week in milliseconds</li>
                <li><code>msg.block.WNc</code> (number): GPS Week Number</li>
            </ul>
            These messages are buffered for playback.
        </dd>
        <dt>command <span class="property-type">string</span></dt>
        <dd>A command string to control the player:
            <ul>
                <li><code>clear</code>: Stops playback (if active) and clears the internal message buffer.</li>
                <li><code>start</code>: Starts playback from the buffered messages, sending them out based on GPS time differences.</li>
                <li><code>stop</code>: Stops the current playback.</li>
            </ul>
        </dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>SBF message <span class="property-type">object</span></dt>
        <dd>The SBF message being played back. If "Adjust Time to Actual" is enabled, the GPS time fields (WNc/TOW) are updated to current GPS time, and the original binary payload is removed.</dd>
    </dl>

    <h3>Details</h3>
    <p>This node collects SBF messages, converting their GPS time coordinates (WNc/TOW) to absolute timestamps for internal sorting and timing calculations.</p>
    <p>When a <code>start</code> command is received:
        <ol>
            <li>The buffer is sorted by GPS timestamp (earliest first).</li>
            <li>Playback begins immediately with the first message.</li>
            <li>Subsequent messages are sent out after delays calculated from GPS time differences.</li>
            <li>The node status indicates playback progress with estimated time remaining.</li>
        </ol>
    </p>
    <p>The <code>stop</code> command halts playback, and <code>clear</code> stops playback and empties the buffer.</p>
    <p><strong>Time Filtering:</strong> Messages with GPS timestamps older than 30 years are automatically rejected as invalid.</p>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Adjust Time to Actual</dt>
        <dd>If checked, during playback the node updates the GPS time fields (WNc/TOW) to reflect the current GPS time, effectively "live-streaming" the historical data. The original binary payload is removed when this option is enabled.</dd>
        <dt>Max Wait Threshold (ms)</dt>
        <dd>Specifies the maximum calculated delay (in milliseconds) between messages before the player considers it a large gap and fast-forwards. Default is 5000ms.</dd>
        <dt>Fallback Wait (ms)</dt>
        <dd>When the delay between messages exceeds the 'Max Wait Threshold', the player will only wait for this duration (in milliseconds) instead of the calculated delay, effectively fast-forwarding. The playback timeline is adjusted to maintain relative timing for subsequent messages. Default is 500ms.</dd>
    </dl>
</script>
