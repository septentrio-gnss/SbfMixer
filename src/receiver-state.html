<script type="text/html" data-help-name="receiver-state">
    <p>Displays the receiver's connection and security status based on SBF message types and the <code>RFStatus</code> SBF block.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>msg <span class="property-type">object</span></dt>
        <dd>
            A message object typically from an SBF parser node. The node monitors:
            <ul>
                <li><code>msg.type</code> (string): Should be "SBF" to indicate valid SBF messages.</li>
                <li><code>msg.blockName</code> (string): When set to "RFStatus", triggers security status evaluation.</li>
                <li><code>msg.block.Flags</code> (number): The integer value containing the RF status flags (for RFStatus blocks).</li>
            </ul>
        </dd>
    </dl>

    <h3>Outputs</h3>
     <p>This node does not produce any output messages. It only updates its status indicator in the Node-RED editor.</p>

    <h3>Status Indicator</h3>
    <p>The node's status indicator reflects the receiver's connection and security status:</p>
    <ul>
        <li><b>Black dot:</b> No SBF messages (no communication)</li>
        <li><b>Blue dot:</b> Connected (receiving SBF messages but no RFStatus block received)</li>
        <li><b>Green dot:</b> Secured (RFStatus indicates good RF condition - Flags & 0b11 == 0)</li>
        <li><b>Red dot:</b> Security issues detected:
            <ul>
                <li>"jammed" (Flags & 0b11 == 1)</li>
                <li>"spoofing" (Flags & 0b11 == 2)</li>
                <li>"jammed and spoofing" (Flags & 0b11 == 3)</li>
            </ul>
        </li>
        <li><b>Gray dot:</b> No message received (timeout after 4 seconds)</li>
    </ul>

    <h3>Details</h3>
    <p>This node monitors the flow of SBF messages and specifically watches for <code>RFStatus</code> blocks to assess the receiver's RF security status.</p>
    <p><strong>Timeout Behavior:</strong> If no SBF messages are received for 4 seconds, the status changes to "no message received". The node checks for timeouts every 2.3 seconds.</p>
    <p><strong>Security Assessment:</strong> When an RFStatus block is received, the node evaluates the least significant 2 bits of the Flags field to determine jamming and spoofing status.</p>
</script>
